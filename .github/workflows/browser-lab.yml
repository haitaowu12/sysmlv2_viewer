name: Browser Lab candidate

on:
  pull_request:
    paths:
      - 'experiments/browser-only-lab/**'
      - 'modeling-lab/**'
      - '.github/workflows/browser-lab.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main, 'mac/**']
    paths:
      - 'experiments/browser-only-lab/**'
      - 'modeling-lab/**'
      - '.github/workflows/browser-lab.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/browser-only-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/browser-only-lab/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build:engine
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: browser-lab-${{ github.sha }}
          path: experiments/browser-only-lab/dist
          retention-days: 90
          if-no-files-found: error
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80484f54610124bc3de1e25eb718d768dccff7db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:web-companion
      - name: Record retained predecessor
        run: |
          node -e "require('fs').writeFileSync('dist/rollback-build.json', JSON.stringify({revision: '80484f54610124bc3de1e25eb718d768dccff7db', purpose: 'retained pre-Lab Pages build'}))"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-rollback-80484f5
          path: dist
          retention-days: 90
          if-no-files-found: error
