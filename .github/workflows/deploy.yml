name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned SysML v2 release corpus
        uses: actions/checkout@v4
        with:
          repository: Systems-Modeling/SysML-v2-Release
          ref: 9baca5908ca28b53da085de69336fde48420ea8f
          path: .external/sysml-v2-release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Release baseline tests
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/.external/sysml-v2-release
        run: npm run test:release

      - name: Build static app
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
